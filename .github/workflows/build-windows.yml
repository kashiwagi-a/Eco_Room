name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install pyinstaller
        pip install openpyxl

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "EcoRoomClean" "EcoRoomClean.py"

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: EcoRoomClean-Windows
        path: dist/EcoRoomClean.exe

    - name: ログイン不要で配布できる最新版Releaseを更新
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: 最新ビルド
        make_latest: true
        files: dist/EcoRoomClean.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}